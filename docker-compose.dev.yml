services:
  app:
    build: ./app
    command: ["node", "--watch", "src/server.js"]
    depends_on:
      - full-story-victim
      - full-story-attacker
      - attacker-view-victim
      - attacker-view-attacker
      - challenge-binding-victim
      - challenge-binding-attacker
      - user-verified-victim
      - user-verified-attacker
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    networks:
      - demo
    volumes:
      - ./app/src:/app/src
      - ./app/public:/app/public
    env_file:
      - .env

  full-story-victim:
    build: ./browser
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - demo
    environment:
      - THEME_COLOR=${VICTIM_THEME_COLOR:-#F9A825}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1152}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-720}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-passkeys.tools}

  full-story-attacker:
    build: ./browser
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - demo
    environment:
      - THEME_COLOR=${ATTACKER_THEME_COLOR:-#C62828}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1152}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-720}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-passkeys.tools}

  attacker-view-victim:
    build: ./browser
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - demo
    environment:
      - THEME_COLOR=${VICTIM_THEME_COLOR:-#F9A825}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1152}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-720}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-passkeys.tools}

  attacker-view-attacker:
    build: ./browser
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - demo
    environment:
      - THEME_COLOR=${ATTACKER_THEME_COLOR:-#C62828}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1152}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-720}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-passkeys.tools}

  challenge-binding-victim:
    build: ./browser
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - demo
    environment:
      - THEME_COLOR=${VICTIM_THEME_COLOR:-#F9A825}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1152}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-720}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-passkeys.tools}

  challenge-binding-attacker:
    build: ./browser
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - demo
    environment:
      - THEME_COLOR=${ATTACKER_THEME_COLOR:-#C62828}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1152}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-720}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-passkeys.tools}

  user-verified-victim:
    build: ./browser
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - demo
    environment:
      - THEME_COLOR=${VICTIM_THEME_COLOR:-#F9A825}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1152}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-720}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-passkeys.tools}

  user-verified-attacker:
    build: ./browser
    restart: unless-stopped
    shm_size: "1gb"
