services:
  app:
    build: ./app
    command: ["node", "--watch", "src/server.js"]
    depends_on:
      - victim
      - attacker
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - demo
    volumes:
      - ./app/src:/app/src
      - ./app/public:/app/public
    env_file:
      - .env

  victim:
    build: ./browser
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - demo
    environment:
      - THEME_COLOR=${VICTIM_THEME_COLOR:-#F9A825}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1152}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-720}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-passkeys.tools}

  attacker:
    build: ./browser
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - demo
    environment:
      - THEME_COLOR=${ATTACKER_THEME_COLOR:-#C62828}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1152}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-720}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-passkeys.tools}

networks:
  demo:
